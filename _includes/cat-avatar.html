{% if author.avatar contains "://" %}
  {% assign cat_avatar_fallback = author.avatar %}
{% else %}
  {% assign cat_avatar_fallback = author.avatar | prepend: "/images/" | prepend: base_path %}
{% endif %}
<div class="author__avatar">
  <img id="rotating-cat-avatar"
       src="{{ cat_avatar_fallback | escape }}"
       data-cat-photos="{{ '/images/cat-portrait-f1d8cdee.webp' | relative_url }}|{{ '/images/cat-portrait-5c6ee4fe.webp' | relative_url }}|{{ '/images/cat-portrait-ac0682f2.webp' | relative_url }}|{{ '/images/cat-portrait-36e6df2f.webp' | relative_url }}|{{ '/images/cat-portrait-0ec1ca3d.webp' | relative_url }}"
       alt="One of Chris Lutsko's cats"
       width="200" height="289"
       style="display:block;width:100%;height:auto;">
</div>
<script src="{{ '/assets/js/cat-avatar-portraits.js' | relative_url }}" defer></script>
